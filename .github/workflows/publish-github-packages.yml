name: Publish DevFlow GitHub Packages

# Packs the DevFlow agent packages and replaces them in the lextudio GitHub Packages feed, so
# consumers (AvalonDock, OpenDevelop) can pin a build of this tree instead of the nuget.org release.
# The version is FORCED to the one on nuget.org (the newest stable LeXtudio.DevFlow.Agent.Core there, or the
# `version` input): consumers keep one version number, NuGet package source mapping decides which feed
# serves it, and the GitHub copy is replaced in place on every run (the same approach as the OpenAvalon
# LibreWPF packages, which also reuse the nuget.org version number).
on:
  push:
    branches: [ master, ci/linux-input-github-packages ]
    paths:
      - 'src/DevFlow/**'
      - 'external/cliclick-sharp/**'
      - '.github/workflows/publish-github-packages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (default: the newest stable LeXtudio.DevFlow.Agent.Core on nuget.org)'
        default: ''

# Two runs pushing the same versions would race on upload; queue them.
concurrency:
  group: publish-devflow-github-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FEED: https://nuget.pkg.github.com/lextudio/index.json

jobs:
  # Windows on Arm: build the input helper natively on an arm64 runner (Native AOT needs the arm64 C++ toolchain).
  cliclick-arm64:
    name: Build CliclickSharp (win-arm64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
      - name: Publish (Native AOT)
        run: |
          dotnet publish external/cliclick-sharp/src/CliclickSharp/CliclickSharp.csproj \
            -c Release -r win-arm64 -p:PublishAot=true -p:OutputType=Exe --self-contained \
            -o out
          ls -l out/CliclickSharp.exe
          out/CliclickSharp.exe -w 20 p p
      - uses: actions/upload-artifact@v4
        with:
          name: cliclick-win-arm64
          path: out/CliclickSharp.exe
          if-no-files-found: error

  publish:
    name: Pack and publish
    needs: cliclick-arm64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      # The CliclickSharp binary the Core package carries is built here from the checked-in source, not taken
      # from the committed dist/: that copy had no Windows option handling (`-w` was taken as a command, so
      # no held drag ever ran on Windows). The Windows runner has the C++ toolchain Native AOT needs.
      # dist/CliclickSharp (the macOS universal binary) is left as committed.
      - name: Build CliclickSharp for Windows (Native AOT)
        run: |
          dotnet publish external/cliclick-sharp/src/CliclickSharp/CliclickSharp.csproj \
            -c Release -r win-x64 -p:PublishAot=true -p:OutputType=Exe --self-contained \
            -o external/cliclick-sharp/dist/win-x64-build
          cp external/cliclick-sharp/dist/win-x64-build/CliclickSharp.exe external/cliclick-sharp/dist/CliclickSharp.exe
          cp external/cliclick-sharp/dist/win-x64-build/CliclickSharp.exe external/cliclick-sharp/dist/win-x64/CliclickSharp.exe
          rm -rf external/cliclick-sharp/dist/win-x64-build
          ls -l external/cliclick-sharp/dist/CliclickSharp.exe

      # Records the runner's display scale: a click tool that is not DPI aware lands off target above 100%.
      - name: Report the display scale
        shell: pwsh
        run: |
          Add-Type -Namespace Native -Name Dpi -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForSystem(); [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);'
          "system DPI = $([Native.Dpi]::GetDpiForSystem()) (96 = 100%), primary screen (as this process sees it) = $([Native.Dpi]::GetSystemMetrics(0)) x $([Native.Dpi]::GetSystemMetrics(1)), arch = $env:PROCESSOR_ARCHITECTURE"

      # The regression this build exists for: options before commands must be parsed, not run as commands.
      - name: Smoke-test CliclickSharp options
        run: |
          external/cliclick-sharp/dist/CliclickSharp.exe -w 20 p p
          echo "exit code: $?"

      - uses: actions/download-artifact@v4
        with:
          name: cliclick-win-arm64
          path: arm64-helper
      - name: Place the arm64 helper
        run: cp arm64-helper/CliclickSharp.exe external/cliclick-sharp/dist/CliclickSharp.arm64.exe

      - name: Resolve the version (nuget.org)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            version="$(curl -fsSL https://api.nuget.org/v3-flatcontainer/lextudio.devflow.agent.core/index.json \
              | python -c "import json,sys; v=[x for x in json.load(sys.stdin)['versions'] if '-' not in x]; print(sorted(v,key=lambda s:[int(p) for p in s.split('.')])[-1])")"
          fi
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Cannot resolve a stable version: '${version}'" >&2
            exit 1
          fi
          echo "Forcing package version ${version}"
          echo "FORCED_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          mkdir -p dist
          projects=(
            src/DevFlow/LeXtudio.DevFlow.Agent.Core/LeXtudio.DevFlow.Agent.Core.csproj
            src/DevFlow/LeXtudio.DevFlow.Agent.Wpf/LeXtudio.DevFlow.Agent.Wpf.csproj
            src/DevFlow/LeXtudio.DevFlow.Agent.LibreWpf/LeXtudio.DevFlow.Agent.LibreWpf.csproj
            src/DevFlow/LeXtudio.DevFlow.Agent.WinForms/LeXtudio.DevFlow.Agent.WinForms.csproj
            src/DevFlow/LeXtudio.DevFlow.Agent.LibreWinForms/LeXtudio.DevFlow.Agent.LibreWinForms.csproj
            src/DevFlow/LeXtudio.DevFlow.Driver/LeXtudio.DevFlow.Driver.csproj
          )
          for project in "${projects[@]}"; do
            # GitVersion would derive a prerelease from the tree; the version is forced instead.
            dotnet pack "${project}" -c Release -o dist \
              -p:GitVersionTaskEnabled=false -p:UpdateVersionProperties=false \
              -p:Version="${FORCED_VERSION}" -p:PackageVersion="${FORCED_VERSION}" -p:InformationalVersion="${FORCED_VERSION}"
          done
          ls -l dist

      - name: Check the packages share one version
        run: |
          versions="$(ls dist/*.nupkg | sed -E 's|.*/||; s|^LeXtudio\.DevFlow\.[A-Za-z.]+\.([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)\.nupkg$|\1|' | sort -u)"
          echo "versions: ${versions}"
          if [ "$(echo "${versions}" | wc -l)" -ne 1 ]; then
            echo "Packages carry different versions" >&2
            exit 1
          fi
          if [ "${versions}" != "${FORCED_VERSION}" ]; then
            echo "Packages carry ${versions}, not the forced ${FORCED_VERSION}" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${versions}" >> "$GITHUB_ENV"

      - name: Replace the packages in GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deleted=()
          failed() {
            if [ ${#deleted[@]} -gt 0 ]; then
              echo "Replacement failed after deleting: ${deleted[*]}. Re-run this workflow." >&2
            fi
          }
          trap failed ERR
          # Git Bash on Windows rewrites a leading slash in an argument into a filesystem path, so the
          # API endpoints below have none.
          # GitHub Packages versions are immutable: delete this version of each package, then push.
          for package in dist/*.nupkg; do
            name="$(basename "${package}" ".${PACKAGE_VERSION}.nupkg")"
            err="$(mktemp)"
            if ! ids="$(gh api --paginate "orgs/lextudio/packages/nuget/${name}/versions?per_page=100" \
              --jq '.[] | select(.name == "'"${PACKAGE_VERSION}"'") | .id' 2>"${err}")"; then
              if grep -q 'HTTP 404' "${err}"; then continue; fi
              cat "${err}" >&2
              exit 1
            fi
            for id in ${ids}; do
              gh api --method DELETE "orgs/lextudio/packages/nuget/${name}/versions/${id}"
              deleted+=("${name}")
            done
          done
          for package in dist/*.nupkg; do
            dotnet nuget push "${package}" --source "${FEED}" --api-key "${GH_TOKEN}"
          done
          echo "Published ${PACKAGE_VERSION}:" | tee -a "${GITHUB_STEP_SUMMARY}"
          ls dist/*.nupkg | sed 's|^|- |' | tee -a "${GITHUB_STEP_SUMMARY}"
